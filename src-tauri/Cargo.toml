[package]
name = "researchgo"
version = "0.1.0"
description = "Research workspace editor"
authors = ["researchgo"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "researchgo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
notify = "8"
libc = "0.2"

# Windows keeps PATH in the registry, and reading it there is the only way a
# toolchain installed after this process launched becomes visible to it. There is
# no registry on the other platforms, so the dependency is Windows-only rather
# than a cross-platform crate used on one target.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
