[package]
name = "researchgo"
version = "0.1.0"
description = "Research workspace editor"
authors = ["researchgo"]
license-file = "../LICENSE"
publish = false
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "researchgo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tests live in the repo's top-level `tests/`, next to the renderer ones, so
# there is one place to look for them. Cargo would otherwise only look in
# `src-tauri/tests`, and the file would have to live far from the TypeScript
# suite it complements.
[[test]]
name = "agent_loop"
path = "../tests/agent_loop.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
schemars = "1.2"
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
notify = "8"
libc = "0.2"
globset = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
similar = "2.7"

# The agent calls an OpenAI-compatible endpoint from the host and reads the
# reply as a stream, because a long answer should be readable while it is still
# arriving. `stream` is what makes `bytes_stream` exist; without it the reply is
# one buffer at the end and the panel has nothing to show until the model is
# already done.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
  "http2",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process"] }

# Windows keeps PATH in the registry, and reading it there is the only way a
# toolchain installed after this process launched becomes visible to it. There is
# no registry on the other platforms, so the dependency is Windows-only rather
# than a cross-platform crate used on one target.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
